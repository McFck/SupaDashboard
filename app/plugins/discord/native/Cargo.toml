[package]
name = "plugin-discord"
version = "1.0.0"
description = "SupaDashboard Discord plugin host: voice state and controls over Discord's local RPC"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "supadashboard-discord"
path = "src/main.rs"

[dependencies]
plugin-sdk = { path = "../../../plugin-sdk", features = ["http", "secure"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
windows = { version = "0.62", features = ["Win32_Storage_FileSystem"] }
