[package]
name = "supadashboard"
version = "0.1.0"
description = "Customizable second-screen dashboard"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
plugin-sdk = { path = "../plugin-sdk" }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
webview2-com = "0.39.1"
windows-future = "0.3.2"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "process"] }
windows = { version = "0.62", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Devices_Display",
  "Win32_Graphics_Dwm",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_RestartManager",
  "Win32_UI_Shell",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer",
  "Win32_UI_HiDpi",
] }
