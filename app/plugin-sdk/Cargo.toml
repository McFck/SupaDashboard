[package]
name = "plugin-sdk"
version = "0.1.0"
description = "Protocol and stdio loop shared by SupaDashboard plugin host processes"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
